<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal K P2P</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem auto;
        max-width: 70rem;
        padding: 0 1rem;
        background: #0b1830;
        color: #e8eef8;
      }
      h1 {
        margin-top: 0;
      }
      h2 {
        border-bottom: 1px solid #27405f;
        padding-bottom: 0.25rem;
      }
      h3 {
        margin: 1rem 0 0.35rem;
        font-size: 0.95rem;
        color: #9fb3c8;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .network-card {
        background: #101f38;
        border: 1px solid #27405f;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        margin: 0.75rem 0 1rem;
      }
      .network-card .row:last-child {
        border-bottom: 0;
      }
      .network-card input[type="checkbox"] {
        accent-color: #0fb9e9;
      }
      .sharing-wrap {
        overflow-x: auto;
        margin-top: 0.5rem;
      }
      .sharing-table {
        width: 100%;
        border-collapse: collapse;
      }
      .sharing-table th,
      .sharing-table td {
        padding: 0.4rem 0.5rem;
        border-bottom: 1px solid #172a45;
        text-align: left;
        vertical-align: top;
      }
      .sharing-table th {
        color: #9fb3c8;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .sharing-table td small {
        color: #9fb3c8;
        display: block;
      }
      section {
        margin: 1.25rem 0;
      }
      pre {
        background: #101f38;
        padding: 0.75rem;
        border-radius: 0.5rem;
        overflow: auto;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
        padding: 0.4rem 0;
        border-bottom: 1px solid #172a45;
      }
      .row code {
        color: #7dd3fc;
      }
      .row span {
        color: #9fb3c8;
      }
      button {
        background: #0fb9e9;
        border: 0;
        color: #06121f;
        padding: 0.35rem 0.7rem;
        border-radius: 0.35rem;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #7dd3fc;
      }
      details {
        margin: 1rem 0;
      }
      summary {
        cursor: pointer;
        color: #9fb3c8;
        font-weight: 600;
      }
      input[type="number"],
      select {
        background: #101f38;
        color: #e8eef8;
        border: 1px solid #27405f;
        border-radius: 0.35rem;
        padding: 0.2rem 0.35rem;
      }
      input[type="number"] {
        width: 5.5rem;
      }
      textarea {
        width: 100%;
        min-height: 4rem;
        background: #101f38;
        color: #e8eef8;
        border: 1px solid #27405f;
        border-radius: 0.35rem;
        padding: 0.5rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.5rem 0;
      }
      #message {
        min-height: 1.4rem;
        color: #7dd3fc;
      }
      #message.error {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <h1>Signal K P2P</h1>
    <div id="message"></div>

    <details>
      <summary>Advanced</summary>
      <section>
        <h2>Identity</h2>
        <div id="identity">loading…</div>
      </section>

      <section>
        <h2>Claims</h2>
        <div id="claims"></div>
      </section>
    </details>

    <section>
      <h2>Groups &amp; networks</h2>
      <div id="public-network"></div>
      <h3>Private groups</h3>
      <div id="groups"></div>
      <div class="actions">
        <button onclick="createGroup()">Create group</button>
        <button onclick="joinGroup()">Join with token</button>
      </div>
      <textarea
        id="token"
        placeholder="Invite token (created or pasted here)"
      ></textarea>
    </section>

    <section id="requests-section">
      <h2>Join requests</h2>
      <div id="requests"></div>
    </section>

    <section id="proposals-section">
      <h2>Pending proposals</h2>
      <div id="proposals"></div>
    </section>

    <script>
      var base = "/plugins/signalk-p2p-plugin";

      function clear(id) {
        var node = document.getElementById(id);
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function text(tag, value) {
        var node = document.createElement(tag);
        node.textContent = value;
        return node;
      }

      function button(label, fn) {
        var node = document.createElement("button");
        node.textContent = label;
        node.onclick = fn;
        return node;
      }

      function say(value, isError) {
        var node = document.getElementById("message");
        node.textContent = value;
        node.className = isError ? "error" : "";
      }

      async function call(path, body) {
        var options =
          body === undefined
            ? {}
            : {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body),
              };
        var response = await fetch(base + path, options);
        var data = {};
        try {
          data = await response.json();
        } catch (error) {}
        if (!response.ok || data.ok === false) {
          throw new Error(data.error || "HTTP " + response.status);
        }
        return data;
      }

      function action(fn) {
        return function () {
          Promise.resolve()
            .then(fn)
            .then(function () {
              say("", false);
              return refresh();
            })
            .catch(function (error) {
              say(String(error), true);
            });
        };
      }

      async function refresh() {
        var results = await Promise.all([
          call("/status"),
          call("/identity"),
          call("/claims"),
          call("/groups"),
          call("/groups/requests"),
          call("/groups/proposals"),
          call("/sharing"),
        ]);
        renderIdentity(results[0], results[1]);
        renderSharing(
          results[0],
          results[6],
          (results[3].groups || []).filter(function (group) {
            return !group.removed;
          }),
        );
        renderClaims(results[2].claims || []);
        renderGroups(results[3].groups || []);
        renderRequests(results[4].requests || []);
        renderProposals(results[5].proposals || []);
      }

      function identityRow(label, value) {
        var row = document.createElement("div");
        row.className = "row";
        row.appendChild(text("code", label));
        row.appendChild(
          text(
            "span",
            value === undefined || value === null ? "—" : String(value),
          ),
        );
        return row;
      }

      function renderIdentity(status, identity) {
        clear("identity");
        var root = document.getElementById("identity");
        identity = identity || {};
        status = status || {};
        root.appendChild(identityRow("Fingerprint", identity.fingerprint));
        root.appendChild(identityRow("Public key", identity.publicKey));
        root.appendChild(
          identityRow("Attestor", identity.isAttestor ? "yes" : "no"),
        );
        root.appendChild(text("h3", "Status"));
        root.appendChild(identityRow("Version", status.version));
        if (status.eventLoop) {
          root.appendChild(
            identityRow("Event-loop max", status.eventLoop.maxMs + " ms"),
          );
          root.appendChild(
            identityRow("Event-loop mean", status.eventLoop.meanMs + " ms"),
          );
        }
        if (status.policy) {
          root.appendChild(
            identityRow(
              "Network policy",
              "v" +
                status.policy.version +
                " · issued " +
                new Date(status.policy.issuedAt * 1000)
                  .toISOString()
                  .slice(0, 10),
            ),
          );
          if (status.policy.operator) {
            root.appendChild(
              identityRow(
                "Policy operator",
                status.policy.operator.slice(0, 16) + "…",
              ),
            );
          }
        }
        root.appendChild(identityRow("Started", status.started ? "yes" : "no"));
        root.appendChild(identityRow("Peers", status.peers));
        root.appendChild(identityRow("Injected vessels", status.injected));
        root.appendChild(identityRow("Claims", status.claims));
        root.appendChild(identityRow("Groups", status.groups));
        root.appendChild(identityRow("Eligible peers", status.eligiblePeers));
        if (status.electedPeer) {
          root.appendChild(
            identityRow(
              "Elected peer",
              status.electedPeer.selfId +
                " (capacity " +
                status.electedPeer.capacity +
                ")",
            ),
          );
        }
        (status.networks || []).forEach(function (network) {
          root.appendChild(
            identityRow(
              "Network",
              network.id +
                " · " +
                network.kind +
                " · " +
                (network.enabled ? "enabled" : "disabled"),
            ),
          );
        });
        if (status.error) {
          root.appendChild(identityRow("Error", status.error));
        }
      }

      function sharingCheckbox(checked, onchange, disabled) {
        var cell = document.createElement("td");
        var input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!checked;
        input.disabled = Boolean(disabled);
        input.onchange = function () {
          onchange(input.checked);
        };
        cell.appendChild(input);
        return cell;
      }

      function renderSharing(status, sharing, groups) {
        clear("public-network");
        var root = document.getElementById("public-network");
        root.className = "network-card";
        status = status || {};
        sharing = sharing || {};
        groups = groups || [];
        var network = sharing.network;
        var publicEnabled = Boolean(network && network.enabled);
        root.appendChild(
          identityRow(
            "Public network",
            network ? network.id : "not configured",
          ),
        );
        if (network) {
          root.appendChild(
            identityRow("Status", network.enabled ? "enabled" : "disabled"),
          );
        }
        root.appendChild(identityRow("Peers", status.peers));
        if (network) {
          var consentRow = document.createElement("div");
          consentRow.className = "row";
          consentRow.appendChild(text("code", "Sharing"));
          var consent = document.createElement("select");
          [
            ["receive-only", "Receive only (don't share my vessel)"],
            ["underway-gated", "Share only while underway"],
            ["coarse-position", "Share an approximate position"],
            ["opt-out", "Share my vessel"],
          ].forEach(function (entry) {
            var option = document.createElement("option");
            option.value = entry[0];
            option.textContent = entry[1];
            consent.appendChild(option);
          });
          consent.value = network.consent || "receive-only";
          consent.onchange = function () {
            setConsent(consent.value);
          };
          consentRow.appendChild(consent);
          root.appendChild(consentRow);
        }

        var ais = sharing.ais || {
          public: false,
          groups: [],
          mode: "off",
        };
        var aisSharing = ais.mode === "both" || ais.mode === "publish";
        var aisModeRow = document.createElement("div");
        aisModeRow.className = "row";
        aisModeRow.appendChild(text("code", "AIS"));
        var aisMode = document.createElement("select");
        [
          ["off", "Off"],
          ["subscribe", "Receive only"],
          ["both", "Share and receive"],
          ["publish", "Share only"],
        ].forEach(function (entry) {
          var option = document.createElement("option");
          option.value = entry[0];
          option.textContent = entry[1];
          aisMode.appendChild(option);
        });
        aisMode.value = ais.mode || "subscribe";
        aisMode.onchange = function () {
          setSharing("ais", { mode: aisMode.value });
        };
        aisModeRow.appendChild(aisMode);
        aisModeRow.appendChild(
          text("span", "Locally heard AIS vessels; audience below."),
        );
        root.appendChild(aisModeRow);

        var wrap = document.createElement("div");
        wrap.className = "sharing-wrap";
        var table = document.createElement("table");
        table.className = "sharing-table";

        var head = document.createElement("tr");
        head.appendChild(text("th", "Data set"));
        head.appendChild(text("th", "Public"));
        groups.forEach(function (group) {
          var th = text("th", group.name || group.id.slice(0, 8));
          th.title = group.id;
          head.appendChild(th);
        });
        table.appendChild(head);

        (sharing.dataSets || []).forEach(function (set) {
          var row = document.createElement("tr");
          var name = document.createElement("td");
          name.appendChild(text("code", set.title));
          name.appendChild(text("small", set.description));
          row.appendChild(name);
          row.appendChild(
            sharingCheckbox(
              set.public,
              function (checked) {
                setSharing(set.id, { public: checked });
              },
              !publicEnabled,
            ),
          );
          groups.forEach(function (group) {
            var checked =
              set.groups === "all" ||
              (Array.isArray(set.groups) && set.groups.indexOf(group.id) >= 0);
            row.appendChild(
              sharingCheckbox(checked, function (value) {
                var current =
                  set.groups === "all"
                    ? groups.map(function (entry) {
                        return entry.id;
                      })
                    : set.groups.slice();
                if (value && current.indexOf(group.id) < 0) {
                  current.push(group.id);
                }
                if (!value) {
                  current = current.filter(function (id) {
                    return id !== group.id;
                  });
                }
                setSharing(set.id, { groups: current });
              }),
            );
          });
          table.appendChild(row);
        });

        var aisRow = document.createElement("tr");
        var aisName = document.createElement("td");
        aisName.appendChild(text("code", "AIS targets"));
        aisName.appendChild(
          text("small", "Locally heard AIS vessels, capped to the nearest."),
        );
        aisRow.appendChild(aisName);
        aisRow.appendChild(
          sharingCheckbox(
            ais.public,
            function (checked) {
              setSharing("ais", { public: checked });
            },
            !publicEnabled || !aisSharing,
          ),
        );
        groups.forEach(function (group) {
          var checked =
            ais.groups === "all" ||
            (Array.isArray(ais.groups) && ais.groups.indexOf(group.id) >= 0);
          aisRow.appendChild(
            sharingCheckbox(
              checked,
              function (value) {
                var current =
                  ais.groups === "all"
                    ? groups.map(function (entry) {
                        return entry.id;
                      })
                    : ais.groups.slice();
                if (value && current.indexOf(group.id) < 0) {
                  current.push(group.id);
                }
                if (!value) {
                  current = current.filter(function (id) {
                    return id !== group.id;
                  });
                }
                setSharing("ais", { groups: current });
              },
              !aisSharing,
            ),
          );
        });
        table.appendChild(aisRow);

        wrap.appendChild(table);
        root.appendChild(wrap);
        if (!groups.length) {
          root.appendChild(
            text(
              "p",
              "No private groups yet. Create or join one to add group columns.",
            ),
          );
        }
        root.appendChild(
          text(
            "p",
            "Check a group column to share that data set with that group. Public membership is open. Changes apply immediately.",
          ),
        );
      }

      async function setConsent(consent) {
        try {
          await call("/network/consent", { consent: consent });
          say("", false);
          return refresh();
        } catch (error) {
          say(String(error), true);
          return refresh();
        }
      }

      async function setSharing(dataSet, update) {
        try {
          await call("/sharing", Object.assign({ dataSet: dataSet }, update));
          say("", false);
          return refresh();
        } catch (error) {
          say(String(error), true);
          return refresh();
        }
      }

      function renderClaims(claims) {
        clear("claims");
        var root = document.getElementById("claims");
        if (!claims.length) {
          root.appendChild(text("p", "No claims."));
          return;
        }
        claims.forEach(function (claim) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(text("code", claim.selfId));
          row.appendChild(
            text(
              "span",
              claim.status +
                " · " +
                (claim.attestations || []).length +
                " attestation(s)",
            ),
          );
          row.appendChild(
            button(
              "Attest",
              action(function () {
                return attest(claim.selfId);
              }),
            ),
          );
          row.appendChild(
            button(
              "Revoke",
              action(function () {
                return revoke(claim.selfId);
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      function renderGroups(groups) {
        clear("groups");
        var root = document.getElementById("groups");
        if (!groups.length) {
          root.appendChild(text("p", "No groups."));
          return;
        }
        groups.forEach(function (group) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(
            text("code", group.name + " · " + group.id.slice(0, 12)),
          );
          row.appendChild(
            text(
              "span",
              group.role +
                " · " +
                group.members +
                " member(s)" +
                (group.removed ? " · removed" : "") +
                (group.pendingProposals
                  ? " · " + group.pendingProposals + " proposal(s)"
                  : ""),
            ),
          );
          if (group.role === "owner" || group.role === "admin") {
            row.appendChild(
              button("Invite", function () {
                createInvite(group.id);
              }),
            );
            row.appendChild(
              button(
                "Remove",
                action(function () {
                  return removeMember(group.id);
                }),
              ),
            );
            row.appendChild(
              button(
                "Promote",
                action(function () {
                  return promoteMember(group.id);
                }),
              ),
            );
          }
          row.appendChild(
            button(
              "Leave",
              action(function () {
                return leaveGroup(group.id);
              }),
            ),
          );
          root.appendChild(row);

          if (!group.removed && group.role !== "viewer") {
            var rateRow = document.createElement("div");
            rateRow.className = "row";
            rateRow.appendChild(text("code", "Publish rate"));
            var input = document.createElement("input");
            input.type = "number";
            input.min = "0.01";
            input.max = String(group.rateCapHz);
            input.step = "0.01";
            input.value = String(group.publishRateHz);
            rateRow.appendChild(input);
            rateRow.appendChild(
              text("span", "/ " + group.rateCapHz + " Hz maximum"),
            );
            rateRow.appendChild(
              button(
                "Set",
                action(function () {
                  return setGroupRate(group.id, Number(input.value));
                }),
              ),
            );
            if (group.role === "owner" || group.role === "admin") {
              rateRow.appendChild(
                button(
                  "Set cap",
                  action(function () {
                    return setGroupRateCap(group.id);
                  }),
                ),
              );
            }
            root.appendChild(rateRow);
          }
        });
      }

      function renderRequests(requests) {
        document.getElementById("requests-section").style.display =
          requests.length ? "" : "none";
        clear("requests");
        var root = document.getElementById("requests");
        if (!requests.length) {
          root.appendChild(text("p", "No pending join requests."));
          return;
        }
        requests.forEach(function (entry) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(text("code", entry.request.member.selfId));
          row.appendChild(
            text(
              "span",
              (entry.request.member.mmsi || "no MMSI") +
                " · " +
                entry.groupId.slice(0, 12) +
                " · nonce " +
                entry.request.inviteNonce.slice(0, 8),
            ),
          );
          row.appendChild(
            button(
              "Approve",
              action(function () {
                return approveRequest(entry);
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      function renderProposals(proposals) {
        document.getElementById("proposals-section").style.display =
          proposals.length ? "" : "none";
        clear("proposals");
        var root = document.getElementById("proposals");
        if (!proposals.length) {
          root.appendChild(text("p", "No pending proposals."));
          return;
        }
        proposals.forEach(function (proposal) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(
            text(
              "code",
              "v" + proposal.version + " · " + proposal.hash.slice(0, 12),
            ),
          );
          row.appendChild(
            text(
              "span",
              proposal.approvals +
                "/" +
                proposal.threshold +
                " approvals · " +
                proposal.groupId.slice(0, 12),
            ),
          );
          row.appendChild(
            button(
              "Approve",
              action(function () {
                return call("/groups/proposals/approve", {
                  groupId: proposal.groupId,
                  hash: proposal.hash,
                });
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      async function attest(selfId) {
        var key = prompt("Key (optional, 64 hex chars)") || "";
        var seconds = prompt("Expires in seconds (blank = never)") || "";
        var body = { selfId: selfId };
        if (key) body.key = key;
        if (seconds)
          body.expiresAt = Math.floor(Date.now() / 1000) + Number(seconds);
        await call("/claims/attest", body);
      }

      async function revoke(selfId) {
        if (!confirm("Revoke this claim?")) return;
        await call("/claims/revoke", { selfId: selfId });
      }

      async function createGroup() {
        var name = prompt("Group name");
        if (!name) return;
        await call("/groups", { name: name });
      }

      async function createInvite(groupId) {
        try {
          var result = await call("/groups/invite", { groupId: groupId });
          var token = result.token || "";
          var field = document.getElementById("token");
          field.value = token;
          field.focus();
          field.select();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            try {
              await navigator.clipboard.writeText(token);
              say(
                "Short invite code copied. Any online group member or relay can redeem it; an admin must approve the join. It expires in 24 hours.",
                false,
              );
              return;
            } catch (error) {}
          }
          say(
            "Short invite code created. Copy it from the box below. It expires in 24 hours.",
            false,
          );
        } catch (error) {
          say(String(error), true);
        }
      }

      async function joinGroup() {
        var token =
          prompt("Paste the group invite code or token") ||
          document.getElementById("token").value;
        if (!token) return;
        try {
          await call("/groups/join", { token: token });
          say("Join request sent. A group admin must approve it.", false);
        } catch (error) {
          say(String(error), true);
        }
      }

      async function approveRequest(entry) {
        var role =
          prompt("Role (admin/member/viewer)", entry.request.member.role) ||
          entry.request.member.role;
        var mmsi =
          prompt("Approved MMSI (optional)", entry.request.member.mmsi || "") ||
          undefined;
        await call("/groups/members/approve", {
          groupId: entry.groupId,
          nonce: entry.request.inviteNonce,
          role: role,
          mmsi: mmsi,
        });
      }

      async function removeMember(groupId) {
        var selfId = prompt("Member selfId to remove");
        if (!selfId) return;
        await call("/groups/members/remove", {
          groupId: groupId,
          selfId: selfId,
        });
      }

      async function promoteMember(groupId) {
        var selfId = prompt("Member selfId");
        if (!selfId) return;
        var role = prompt("Role (admin/member/viewer)", "member") || "member";
        await call("/groups/members/promote", {
          groupId: groupId,
          selfId: selfId,
          role: role,
        });
      }

      async function leaveGroup(groupId) {
        if (!confirm("Leave this group?")) return;
        await call("/groups/leave", { groupId: groupId });
      }

      async function setGroupRate(groupId, rateHz) {
        await call("/groups/rate", { groupId: groupId, rateHz: rateHz });
      }

      async function setGroupRateCap(groupId) {
        var value = prompt("Group publish rate cap (Hz)", "1");
        if (value === null) return;
        await call("/groups/rate-cap", {
          groupId: groupId,
          rateHz: Number(value),
        });
      }

      refresh().catch(function (error) {
        say(String(error), true);
      });

      setInterval(function () {
        if (document.visibilityState !== "visible") return;
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") {
          return;
        }
        refresh().catch(function (error) {
          say(String(error), true);
        });
      }, 5000);
    </script>
  </body>
</html>
