<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Signal K P2P</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 1.5rem auto;
        max-width: 70rem;
        padding: 0 1rem;
        background: #0b1830;
        color: #e8eef8;
      }
      h1 {
        margin-top: 0;
      }
      h2 {
        border-bottom: 1px solid #27405f;
        padding-bottom: 0.25rem;
      }
      h3 {
        margin: 1rem 0 0.35rem;
        font-size: 0.95rem;
        color: #9fb3c8;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .network-card {
        background: #101f38;
        border: 1px solid #27405f;
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        margin: 0.75rem 0 1rem;
      }
      .network-card .row:last-child {
        border-bottom: 0;
      }
      .network-card input[type="checkbox"] {
        accent-color: #0fb9e9;
      }
      section {
        margin: 1.25rem 0;
      }
      pre {
        background: #101f38;
        padding: 0.75rem;
        border-radius: 0.5rem;
        overflow: auto;
      }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: wrap;
        padding: 0.4rem 0;
        border-bottom: 1px solid #172a45;
      }
      .row code {
        color: #7dd3fc;
      }
      .row span {
        color: #9fb3c8;
      }
      button {
        background: #0fb9e9;
        border: 0;
        color: #06121f;
        padding: 0.35rem 0.7rem;
        border-radius: 0.35rem;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #7dd3fc;
      }
      textarea {
        width: 100%;
        min-height: 4rem;
        background: #101f38;
        color: #e8eef8;
        border: 1px solid #27405f;
        border-radius: 0.35rem;
        padding: 0.5rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 0.5rem 0;
      }
      #message {
        min-height: 1.4rem;
        color: #7dd3fc;
      }
      #message.error {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <h1>Signal K P2P</h1>
    <div id="message"></div>

    <section>
      <h2>Identity</h2>
      <div id="identity">loading…</div>
    </section>

    <section>
      <h2>Claims</h2>
      <div id="claims"></div>
    </section>

    <section>
      <h2>Groups &amp; networks</h2>
      <div id="public-network"></div>
      <h3>Private groups</h3>
      <div id="groups"></div>
      <div class="actions">
        <button onclick="createGroup()">Create group</button>
        <button onclick="invite()">Create invite</button>
        <button onclick="joinGroup()">Join with token</button>
        <button onclick="setThreshold()">Set threshold</button>
      </div>
      <textarea
        id="token"
        placeholder="Invite token (created or pasted here)"
      ></textarea>
    </section>

    <section>
      <h2>Join requests</h2>
      <div id="requests"></div>
    </section>

    <section>
      <h2>Pending proposals</h2>
      <div id="proposals"></div>
    </section>

    <script>
      var base = "/plugins/signalk-p2p-plugin";

      function clear(id) {
        var node = document.getElementById(id);
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function text(tag, value) {
        var node = document.createElement(tag);
        node.textContent = value;
        return node;
      }

      function button(label, fn) {
        var node = document.createElement("button");
        node.textContent = label;
        node.onclick = fn;
        return node;
      }

      function say(value, isError) {
        var node = document.getElementById("message");
        node.textContent = value;
        node.className = isError ? "error" : "";
      }

      async function call(path, body) {
        var options =
          body === undefined
            ? {}
            : {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify(body),
              };
        var response = await fetch(base + path, options);
        var data = {};
        try {
          data = await response.json();
        } catch (error) {}
        if (!response.ok || data.ok === false) {
          throw new Error(data.error || "HTTP " + response.status);
        }
        return data;
      }

      function action(fn) {
        return function () {
          Promise.resolve()
            .then(fn)
            .then(function () {
              say("", false);
              return refresh();
            })
            .catch(function (error) {
              say(String(error), true);
            });
        };
      }

      async function refresh() {
        var results = await Promise.all([
          call("/status"),
          call("/identity"),
          call("/claims"),
          call("/groups"),
          call("/groups/requests"),
          call("/groups/proposals"),
          call("/sharing"),
        ]);
        renderIdentity(results[0], results[1]);
        renderPublicNetwork(results[0], results[6]);
        renderClaims(results[2].claims || []);
        renderGroups(results[3].groups || []);
        renderRequests(results[4].requests || []);
        renderProposals(results[5].proposals || []);
      }

      function identityRow(label, value) {
        var row = document.createElement("div");
        row.className = "row";
        row.appendChild(text("code", label));
        row.appendChild(
          text(
            "span",
            value === undefined || value === null ? "—" : String(value),
          ),
        );
        return row;
      }

      function renderIdentity(status, identity) {
        clear("identity");
        var root = document.getElementById("identity");
        identity = identity || {};
        status = status || {};
        root.appendChild(identityRow("Fingerprint", identity.fingerprint));
        root.appendChild(identityRow("Public key", identity.publicKey));
        root.appendChild(
          identityRow("Attestor", identity.isAttestor ? "yes" : "no"),
        );
        root.appendChild(text("h3", "Status"));
        root.appendChild(identityRow("Version", status.version));
        root.appendChild(identityRow("Started", status.started ? "yes" : "no"));
        root.appendChild(identityRow("Peers", status.peers));
        root.appendChild(identityRow("Injected vessels", status.injected));
        root.appendChild(identityRow("Claims", status.claims));
        root.appendChild(identityRow("Groups", status.groups));
        root.appendChild(identityRow("Eligible peers", status.eligiblePeers));
        if (status.electedPeer) {
          root.appendChild(
            identityRow(
              "Elected peer",
              status.electedPeer.selfId +
                " (capacity " +
                status.electedPeer.capacity +
                ")",
            ),
          );
        }
        (status.networks || []).forEach(function (network) {
          root.appendChild(
            identityRow(
              "Network",
              network.id +
                " · " +
                network.kind +
                " · " +
                (network.enabled ? "enabled" : "disabled"),
            ),
          );
        });
        if (status.error) {
          root.appendChild(identityRow("Error", status.error));
        }
      }

      function renderPublicNetwork(status, sharing) {
        clear("public-network");
        var root = document.getElementById("public-network");
        root.className = "network-card";
        status = status || {};
        sharing = sharing || {};
        var network = sharing.network;
        root.appendChild(
          identityRow(
            "Public network",
            network ? network.id : "not configured",
          ),
        );
        if (network) {
          root.appendChild(
            identityRow(
              "Status",
              (network.enabled ? "enabled" : "disabled") +
                " · " +
                (network.consent || "opt-out"),
            ),
          );
        }
        root.appendChild(identityRow("Peers", status.peers));
        if (status.electedPeer) {
          root.appendChild(
            identityRow(
              "Elected relay",
              status.electedPeer.selfId +
                " (capacity " +
                status.electedPeer.capacity +
                ")",
            ),
          );
        }
        (sharing.dataSets || []).forEach(function (set) {
          var label = document.createElement("label");
          label.className = "row";
          var input = document.createElement("input");
          input.type = "checkbox";
          input.checked = !!set.public;
          input.disabled = !(network && network.enabled);
          input.onchange = function () {
            setPublic(set.id, input.checked);
          };
          label.appendChild(input);
          label.appendChild(text("code", set.title));
          label.appendChild(text("span", set.description));
          root.appendChild(label);
        });
        root.appendChild(
          text(
            "p",
            "Open membership. Changes are saved to the plugin configuration and apply immediately.",
          ),
        );
      }

      async function setPublic(dataSet, enabled) {
        try {
          await call("/sharing", { dataSet: dataSet, public: enabled });
          say("", false);
          return refresh();
        } catch (error) {
          say(String(error), true);
          return refresh();
        }
      }

      function renderClaims(claims) {
        clear("claims");
        var root = document.getElementById("claims");
        if (!claims.length) {
          root.appendChild(text("p", "No claims."));
          return;
        }
        claims.forEach(function (claim) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(text("code", claim.selfId));
          row.appendChild(
            text(
              "span",
              claim.status +
                " · " +
                (claim.attestations || []).length +
                " attestation(s)",
            ),
          );
          row.appendChild(
            button(
              "Attest",
              action(function () {
                return attest(claim.selfId);
              }),
            ),
          );
          row.appendChild(
            button(
              "Revoke",
              action(function () {
                return revoke(claim.selfId);
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      function renderGroups(groups) {
        clear("groups");
        var root = document.getElementById("groups");
        if (!groups.length) {
          root.appendChild(text("p", "No groups."));
          return;
        }
        groups.forEach(function (group) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(
            text("code", group.name + " · " + group.id.slice(0, 12)),
          );
          row.appendChild(
            text(
              "span",
              group.role +
                " · epoch " +
                group.epoch +
                " · " +
                group.members +
                " member(s)" +
                (group.removed ? " · removed" : "") +
                (group.pendingProposals
                  ? " · " + group.pendingProposals + " proposal(s)"
                  : ""),
            ),
          );
          row.appendChild(
            button(
              "Remove",
              action(function () {
                return removeMember(group.id);
              }),
            ),
          );
          row.appendChild(
            button(
              "Promote",
              action(function () {
                return promoteMember(group.id);
              }),
            ),
          );
          row.appendChild(
            button(
              "Leave",
              action(function () {
                return leaveGroup(group.id);
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      function renderRequests(requests) {
        clear("requests");
        var root = document.getElementById("requests");
        if (!requests.length) {
          root.appendChild(text("p", "No pending join requests."));
          return;
        }
        requests.forEach(function (entry) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(text("code", entry.request.member.selfId));
          row.appendChild(
            text(
              "span",
              (entry.request.member.mmsi || "no MMSI") +
                " · " +
                entry.groupId.slice(0, 12) +
                " · nonce " +
                entry.request.inviteNonce.slice(0, 8),
            ),
          );
          row.appendChild(
            button(
              "Approve",
              action(function () {
                return approveRequest(entry);
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      function renderProposals(proposals) {
        clear("proposals");
        var root = document.getElementById("proposals");
        if (!proposals.length) {
          root.appendChild(text("p", "No pending proposals."));
          return;
        }
        proposals.forEach(function (proposal) {
          var row = document.createElement("div");
          row.className = "row";
          row.appendChild(
            text(
              "code",
              "v" + proposal.version + " · " + proposal.hash.slice(0, 12),
            ),
          );
          row.appendChild(
            text(
              "span",
              proposal.approvals +
                "/" +
                proposal.threshold +
                " approvals · " +
                proposal.groupId.slice(0, 12),
            ),
          );
          row.appendChild(
            button(
              "Approve",
              action(function () {
                return call("/groups/proposals/approve", {
                  groupId: proposal.groupId,
                  hash: proposal.hash,
                });
              }),
            ),
          );
          root.appendChild(row);
        });
      }

      async function attest(selfId) {
        var key = prompt("Key (optional, 64 hex chars)") || "";
        var seconds = prompt("Expires in seconds (blank = never)") || "";
        var body = { selfId: selfId };
        if (key) body.key = key;
        if (seconds)
          body.expiresAt = Math.floor(Date.now() / 1000) + Number(seconds);
        await call("/claims/attest", body);
      }

      async function revoke(selfId) {
        if (!confirm("Revoke this claim?")) return;
        await call("/claims/revoke", { selfId: selfId });
      }

      async function createGroup() {
        var name = prompt("Group name");
        if (!name) return;
        await call("/groups", { name: name });
      }

      async function invite() {
        var groupId = prompt("Group id");
        if (!groupId) return;
        var role =
          prompt("Role (owner/admin/member/viewer)", "member") || "member";
        var days = Number(prompt("Expires in days", "7") || "7");
        var result = await call("/groups/invite", {
          groupId: groupId,
          role: role,
          expiresInSeconds: Math.max(60, days * 86400),
        });
        document.getElementById("token").value = result.token || "";
      }

      async function joinGroup() {
        var token =
          prompt("Invite token") || document.getElementById("token").value;
        if (!token) return;
        var mmsi = prompt("Your MMSI (optional)") || undefined;
        await call("/groups/join", { token: token, mmsi: mmsi });
      }

      async function approveRequest(entry) {
        var role =
          prompt("Role (admin/member/viewer)", entry.request.member.role) ||
          entry.request.member.role;
        var mmsi =
          prompt("Approved MMSI (optional)", entry.request.member.mmsi || "") ||
          undefined;
        await call("/groups/members/approve", {
          groupId: entry.groupId,
          nonce: entry.request.inviteNonce,
          role: role,
          mmsi: mmsi,
        });
      }

      async function removeMember(groupId) {
        var selfId = prompt("Member selfId to remove");
        if (!selfId) return;
        await call("/groups/members/remove", {
          groupId: groupId,
          selfId: selfId,
        });
      }

      async function promoteMember(groupId) {
        var selfId = prompt("Member selfId");
        if (!selfId) return;
        var role = prompt("Role (admin/member/viewer)", "member") || "member";
        await call("/groups/members/promote", {
          groupId: groupId,
          selfId: selfId,
          role: role,
        });
      }

      async function leaveGroup(groupId) {
        if (!confirm("Leave this group?")) return;
        await call("/groups/leave", { groupId: groupId });
      }

      async function setThreshold() {
        var groupId = prompt("Group id");
        if (!groupId) return;
        var threshold = Number(prompt("Required admin approvals", "1") || "1");
        await call("/groups/threshold", {
          groupId: groupId,
          threshold: threshold,
        });
      }

      refresh().catch(function (error) {
        say(String(error), true);
      });
    </script>
  </body>
</html>
